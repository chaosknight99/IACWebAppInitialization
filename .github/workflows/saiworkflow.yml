name: Basic workflow

on:
  workflow_dispatch:

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Display Hello World
      run: echo "Hello, World!"

  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout code
    - uses: actions/checkout@main

      # Log into Azure
    - uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy ARM template
    - name: Create Resource Group
      run: |
        az group create --name rg-sai-test1 --location eastus
